# `mise dotfiles apply` from this directory links the plain-file configs into
# $HOME. This is the path for an account without Nix; home-manager sources
# the same files once it exists.
#
[dotfiles]
"~/.config/zsh/dotfiles.zsh" = { source = "tools/zsh/interactive.zsh", mode = "symlink" }
"~/.zshrc/dotfiles" = { line = "[[ -r ~/.config/zsh/dotfiles.zsh ]] && source ~/.config/zsh/dotfiles.zsh" }
"~/.config/helix" = { source = "tools/helix", mode = "symlink" }
"~/.config/git/ignore" = { source = "tools/git/ignore", mode = "symlink" }
# Not a symlink to ~/.config/git/config: with no ~/.gitconfig, git writes
# `git config --global` there, which would put identity in the tracked file.
"~/.config/git/dotfiles.gitconfig" = { source = "tools/git/config", mode = "symlink" }
"~/.gitconfig/dotfiles" = { line = "[include] path = ~/.config/git/dotfiles.gitconfig" }
# conf.d, not ~/.config/jj/config.toml: `jj config set --user` writes that file,
# so identity would land in the tracked config. conf.d is merged over it, so
# this file must never carry a [user] block.
"~/.config/jj/conf.d/dotfiles.toml" = { source = "tools/jujutsu/config", mode = "symlink" }
# jj-stash (tools/jj-stash): park commit chains out of every jj UI. Needs
# bash 4+, which mise can't supply: macOS's /bin/bash is 3.2.
"~/.local/bin/jj-stash" = { source = "tools/jj-stash/jj-stash", mode = "symlink" }
# The directory, not the justfile: just resolves imports relative to where it
# finds the justfile. `just -g <recipe>` then works from anywhere.
"~/.config/just" = { source = "tools/just", mode = "symlink" }
# The commands the global recipes call. ~/.local/bin is on PATH in zsh on the
# Mac and in the devcontainers.
"~/.local/bin/huid-task" = { source = "tasks/scripts/huid-task", mode = "symlink" }
"~/.local/bin/huid-task-edit" = { source = "tasks/scripts/huid-task-edit", mode = "symlink" }
"~/.local/bin/huid-tasks-vscode" = { source = "tasks/scripts/huid-tasks-vscode", mode = "symlink" }
# just itself, globally: the root [tools] only apply inside this repo.
"~/.config/mise/conf.d/dotfiles.toml" = { source = "tools/mise/global.toml", mode = "symlink" }
# Claude Code's SessionEnd hook: one resume pointer per session on taskbook's
# @claude board. Only the script is linked. The hook entry goes into
# ~/.claude/settings.json by `mise run claude-hooks`, a merge, because Claude
# writes that file itself (theme, model), so a link would track those too.
"~/.claude/hooks/session-end-taskbook.sh" = { source = "tools/claude/hooks/session-end-taskbook.sh", mode = "symlink" }

[env]
EDITOR = "hx"

# After every `mise install`: install the HUID Tasks extension from this
# checkout. --if-available skips when there's no VS Code yet (a new
# devcontainer, where postAttachCommand installs it once VS Code attaches).
[hooks]
postinstall = "{{config_root}}/tasks/scripts/huid-tasks-vscode --if-available"

[settings]
minimum_release_age_excludes = ["claude"]

[tools]
just = "latest"
jujutsu = "0.45"
helix = "25"
gh = "latest"
claude = "latest"
tmux = "latest"
# tools/claude/install-hooks merges JSON with it.
jq = "latest"

# Tasks are one-time setup steps you run by hand (`mise run <task>`), written
# so that running one again does nothing. Never make them run automatically,
# e.g. from a hook: a login prompt with no terminal attached just hangs.
[tasks.claude-hooks]
description = "Register the SessionEnd taskbook hook in ~/.claude/settings.json, unless it is"
# The hook itself is in tools/claude/hooks.json; the script it runs is linked
# by [dotfiles] above, so apply that first. Merging again changes nothing.
run = "{{config_root}}/tools/claude/install-hooks"

[tasks.ssh-key]
description = "Create an SSH key for GitHub, unless one exists"
# gh-login uses SSH, so this runs first. The key gets the default name
# (id_ed25519). The Host block below makes ssh store the passphrase in the
# macOS keychain on first use and reload the key after a reboot. Without it,
# GitHub only works while some other key (e.g. tangled.org's) is in the agent.
# UseKeychain is macOS-only; IgnoreUnknown keeps the block valid for Linux ssh,
# which otherwise rejects the whole config file.
run = '''
if [ -f ~/.ssh/id_ed25519 ]; then
  echo "ssh: ~/.ssh/id_ed25519 already exists"
else
  mkdir -p ~/.ssh && chmod 700 ~/.ssh
  ssh-keygen -t ed25519 -C "$(whoami)@$(hostname -s)" -f ~/.ssh/id_ed25519
fi
if ! grep -qx 'Host github.com' ~/.ssh/config 2>/dev/null; then
  printf '\nHost github.com\n    AddKeysToAgent yes\n    IgnoreUnknown UseKeychain\n    UseKeychain yes\n    IdentityFile ~/.ssh/id_ed25519\n' >> ~/.ssh/config
  echo "ssh: added a github.com block to ~/.ssh/config"
fi
'''

[tasks.gh-login]
description = "Log gh in over SSH, unless it already is"
depends = ["ssh-key"]
# Logging in with --git-protocol ssh offers to upload ~/.ssh/id_ed25519.pub.
# If gh was already logged in, upload the key directly unless GitHub has it.
# Last, a checkout cloned over https can't push: this account has no git
# credential helper. Switch origin to SSH once GitHub accepts the key (ssh -T
# exits 1 even on success, hence the grep). Tasks run from this directory, so
# `git` here is whichever checkout this mise.toml lives in.
run = '''
if ! gh auth status >/dev/null 2>&1; then
  gh auth login --git-protocol ssh
elif gh ssh-key list 2>/dev/null | grep -qF "$(cut -d' ' -f2 ~/.ssh/id_ed25519.pub)"; then
  echo "gh: logged in, and GitHub has ~/.ssh/id_ed25519.pub"
else
  gh ssh-key add ~/.ssh/id_ed25519.pub --title "$(whoami)@$(hostname -s)"
fi
remote=$(git remote get-url origin 2>/dev/null || true)
case "$remote" in
  https://github.com/*)
    if ssh -T -o StrictHostKeyChecking=accept-new git@github.com 2>&1 | grep -q "successfully authenticated"; then
      git remote set-url origin "git@github.com:${remote#https://github.com/}"
      echo "gh: origin now pushes over SSH ($(git remote get-url origin))"
    else
      echo "gh: GitHub doesn't accept the SSH key yet; origin stays on $remote"
    fi
    ;;
esac
'''

[tasks.identity]
description = "Set git and jj identity from the logged-in GitHub account"
depends = ["gh-login"]
# gh is authenticated by the time this runs, and it knows who you are.
# tools/git/config carries no [user] block, so reading identity back out of
# git (`git config --get user.name`) would give an empty string.
#
# .email is not guaranteed. It is only populated when the profile email is
# public or the token carries the user:email scope, and `gh auth login`
# grants neither by default - so fall back to the GitHub noreply address,
# which GitHub still attributes to the account.
#
# git identity goes to ~/.gitconfig (global), never to tools/git/config,
# which is tracked and must stay identity-free.
#
# jj note: `jj config set --user` writes ~/.config/jj/config.toml, and jj
# merges ~/.config/jj/conf.d/*.toml OVER that file. Nothing here puts a
# [user] block in conf.d for exactly that reason - it would silently win
# over every later `jj config set`. Verified on jj 0.45.1.
run = '''
if ! gh auth status >/dev/null 2>&1; then
  echo "identity: gh is not logged in; run 'mise run gh-login' first" >&2
  exit 1
fi

name=$(gh api user --jq '.name // .login')
email=$(gh api user --jq '.email // empty')
if [ -z "$email" ]; then
  email=$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"')
  echo "identity: profile email not visible to this token, using $email"
fi

if git config --global --get user.name >/dev/null 2>&1; then
  echo "git:  user.name already set to $(git config --global --get user.name)"
else
  git config --global user.name "$name"
  echo "git:  set user.name to $name"
fi
if git config --global --get user.email >/dev/null 2>&1; then
  echo "git:  user.email already set to $(git config --global --get user.email)"
else
  git config --global user.email "$email"
  echo "git:  set user.email to $email"
fi

# `jj config get` exits 0 whether or not the key is set, so the guard has to
# look at the output rather than the exit code.
if ! command -v jj >/dev/null 2>&1; then
  echo "jj:   not installed, skipping"
elif [ -n "$(jj config get user.name 2>/dev/null)" ] && [ -n "$(jj config get user.email 2>/dev/null)" ]; then
  echo "jj:   already configured as $(jj config get user.name) <$(jj config get user.email)>"
else
  jj config set --user user.name "$name"
  jj config set --user user.email "$email"
  echo "jj:   set user.name/user.email to $name <$email>"
fi
'''
