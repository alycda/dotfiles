# Tests: bats suites under tests/, with mise and the just and jj it pins.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits; the comment is the tag that was pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      # Plain bats: the tests use none of the helper libraries.
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      # tests/zsh.bats needs zsh, and jj for its chpwd tests (the version mise
      # pins, verified by checksum).
      - name: Install zsh
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Install jj
        env:
          JJ_VERSION: v0.45.1
          JJ_SHA256: f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72
        run: |
          tarball="jj-$JJ_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "https://github.com/jj-vcs/jj/releases/download/$JJ_VERSION/$tarball"
          echo "$JJ_SHA256  $tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/jj" && tar -xzf "$tarball" -C "$RUNNER_TEMP/jj"
          echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"
      # mise at the version tests/mise.bats was written against. The action's
      # default `mise install` installs the root mise.toml's tools for real,
      # which is what catches a bad version pin (a dry run only warns).
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.10
      # tests/import-issue.bats stubs gh, except for one test that sends the
      # real GraphQL query to GitHub. It runs only when GH_TOKEN is set; the
      # runner already has gh and jq.
      - run: bats tests
        env:
          GH_TOKEN: ${{ github.token }}
