# Tests: bats suites under tests/, with mise and the just the recipes need.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits; the comment is the tag that was pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      # Plain bats: the tests use none of the helper libraries.
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      # tests/mise.bats starts zsh from the HOME [dotfiles] applied to.
      - name: Install zsh
        run: sudo apt-get install -y --no-install-recommends zsh
      # mise at the version tests/mise.bats was written against. The action's
      # default `mise install` installs the root mise.toml's tools for real,
      # which is what catches a tool that no longer installs.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.10
      - run: bats tests
