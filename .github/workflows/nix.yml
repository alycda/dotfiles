name: Nix

on:
  push:
    # automation/flake-update: manual fixup commits on the bot's update-PR
    # branch get re-validated (the bot's own GITHUB_TOKEN pushes are exempt
    # from triggering this; update-flake-lock.yml dispatches us instead)
    branches: [main, master, automation/flake-update]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Nix Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Lint with statix
        run: |
          nix profile install nixpkgs#statix
          statix check .

      - name: Check for dead code
        run: |
          nix profile install nixpkgs#deadnix
          deadnix --fail .

  check:
    name: Validate Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check flake
        run: nix flake check --all-systems

      # `nix flake check` only evaluates output types it recognizes;
      # darwinConfigurations and homeConfigurations are skipped as unknown,
      # so without this step CI never evaluates the configs anyone actually
      # switches to.
      - name: Evaluate darwin and home configurations
        run: ./.github/scripts/eval-configurations.sh

      - name: Show flake outputs
        run: nix flake show
