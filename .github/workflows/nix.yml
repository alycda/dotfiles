# The flake: does it evaluate on every system it lists, with the lock as
# committed, is its Nix formatted, does the dev shell deliver its tools, and
# does the home-manager profile give zsh its config? Runs when Nix files, or
# the zsh config the profile sources, change.
name: nix

on:
  push:
    paths: &paths
      - flake.nix
      - flake.lock
      - "**/*.nix"
      - tools/zsh/**
      - .github/scripts/check-hm-zsh
      - .github/workflows/nix.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Evaluation only, so one runner covers every system. --no-update-lock-file
  # fails when flake.lock no longer matches the inputs in flake.nix. nixfmt
  # comes from the flake's own nixpkgs pin, not whatever the registry says.
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits; the comment is the tag that was pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Evaluate for every system
        run: nix flake check --all-systems --no-update-lock-file
      - name: Format
        run: git ls-files -z '*.nix' | xargs -0 nix run --inputs-from . nixpkgs#nixfmt -- --check

  # Building the dev shell needs the system itself, so one runner per system
  # the flake lists: Linux on both architectures, and an Apple Silicon Mac.
  shell:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Dev shell
        run: nix develop --no-update-lock-file -c sh -c 'jj --version && just --version'

  # The devcontainer profile, switched for a real vscode user whose ~/.zshrc
  # already exists, as the image's oh-my-zsh one does: home-manager takes it
  # over (-b moves the old one aside), and an interactive zsh must then have
  # tools/zsh/interactive.zsh on top of home-manager's defaults. The copy in
  # /tmp is one vscode can read; path: keeps nix from asking git about it.
  home:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: A vscode user with a ~/.zshrc of its own
        run: |
          sudo apt-get install -y --no-install-recommends zsh
          sudo useradd --create-home --shell /usr/bin/zsh vscode
          echo '# oh-my-zsh, as the image has' | sudo -u vscode tee /home/vscode/.zshrc > /dev/null
          cp -R . /tmp/dotfiles && chmod -R a+rX /tmp/dotfiles
      - name: Switch
        working-directory: /tmp/dotfiles
        run: >-
          sudo -u vscode -H env PATH="$PATH" USER=vscode
          nix run --no-update-lock-file path:.#home-manager --
          switch -b backup --flake path:.#vscode@x86_64-linux
      - name: The old ~/.zshrc was moved aside
        run: sudo grep -q oh-my-zsh /home/vscode/.zshrc.backup
      # compinit refuses completion dirs that are writable by, or owned by,
      # someone other than root and the user. The runner image has some, and
      # without a terminal to ask "continue?", compinit aborts. The
      # devcontainer image has none, so this is the runner's to fix: list
      # them, then hand them to root.
      - name: Secure what compaudit flags
        run: |
          dirs="$(sudo -u vscode -H zsh -i -c 'autoload -Uz compaudit; compaudit' 2> /dev/null || true)"
          printf '%s\n' "${dirs:-none}"
          [ -n "$dirs" ] || exit 0
          printf '%s\n' "$dirs" | xargs -r -d '\n' sudo chown root:root
          printf '%s\n' "$dirs" | xargs -r -d '\n' sudo chmod go-w
      - name: Interactive zsh
        run: sudo -u vscode -H zsh -i /tmp/dotfiles/.github/scripts/check-hm-zsh
