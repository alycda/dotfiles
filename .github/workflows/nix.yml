# The flake: does it evaluate on every system it lists, with the lock as
# committed, is its Nix formatted, does the dev shell deliver its tools, do
# every home-manager profile and every Mac build, and does the profile for a
# vscode user give zsh its config? Runs when Nix files, or the files the
# profiles link or source, change.
name: nix

on:
  push:
    paths: &paths
      - flake.nix
      - flake.lock
      - "**/*.nix"
      - tools/**
      - tasks/scripts/**
      # home-manager/agenix.nix installs every .age file under secrets/.
      - secrets/**
      # Run in the dev shell, which has the rage and ragenix it needs.
      - tests/edit-secret.bats
      - .github/scripts/check-hm-zsh
      - .github/workflows/nix.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Evaluation only, so one runner covers every system. --no-update-lock-file
  # fails when flake.lock no longer matches the inputs in flake.nix. nixfmt
  # comes from the flake's own nixpkgs pin, not whatever the registry says.
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits; the comment is the tag that was pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Evaluate for every system
        run: nix flake check --all-systems --no-update-lock-file
      # flake check skips darwinConfigurations and homeConfigurations: they
      # aren't outputs it knows. Evaluating each one's derivation catches a
      # broken module or option on every Mac and account, for every system,
      # without building anything.
      - name: Evaluate every configuration
        run: |
          nix eval --no-update-lock-file --json .#darwinConfigurations \
            --apply 'builtins.mapAttrs (_: c: c.system.drvPath)'
          nix eval --no-update-lock-file --json .#homeConfigurations \
            --apply 'builtins.mapAttrs (_: c: c.activationPackage.drvPath)'
      - name: Format
        run: git ls-files -z '*.nix' | xargs -0 nix run --inputs-from . nixpkgs#nixfmt -- --check

  # Building the dev shell needs the system itself, so one runner per system
  # the flake lists: Linux on both architectures, and an Apple Silicon Mac.
  shell:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Dev shell
        run: nix develop --no-update-lock-file -c sh -c 'jj --version && just --version'
      # tools/secrets/edit-secret with the dev shell's rage and ragenix, which
      # test.yml doesn't have, so the suite skips there. bats comes from the
      # flake's nixpkgs; the dev shell keeps the PATH it starts from. Listing
      # the tools first fails the step if one is missing, where bats would
      # skip.
      - name: edit-secret
        run: >-
          nix shell --inputs-from . nixpkgs#bats -c
          nix develop --no-update-lock-file -c sh -c
          'command -v rage && command -v rage-keygen && command -v ragenix &&
          command -v bats && bats tests/edit-secret.bats'

  # Every homeConfigurations output the flake lists, built, on a runner of its
  # own system: Linux on both architectures, and an Apple Silicon Mac for an
  # account such as code@aarch64-darwin. The names come from the flake,
  # so a profile added to flake.nix is built without touching this file.
  # Building the activation package runs nothing as the user, so root's
  # builds as well as vscode's.
  homes:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    env:
      SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build each profile for this system
        run: |
          names=$(nix eval --no-update-lock-file --json .#homeConfigurations \
            --apply builtins.attrNames | jq -r --arg s "@$SYSTEM" '.[] | select(endswith($s))')
          test -n "$names" || { echo "no homeConfigurations for $SYSTEM" >&2; exit 1; }
          for name in $names; do
            echo "::group::$name"
            nix build --no-update-lock-file --no-link ".#homeConfigurations.\"$name\".activationPackage"
            echo "::endgroup::"
          done

  # Every darwinConfigurations output the flake lists, built on an Apple
  # Silicon Mac: the system closure, with its home-manager users and
  # Homebrew's Brewfile, without activating it, so nothing touches the
  # runner. The names come from the flake, so a Mac added to flake.nix is
  # built without touching this file.
  darwins:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build each Mac
        run: |
          names=$(nix eval --no-update-lock-file --json .#darwinConfigurations \
            --apply builtins.attrNames | jq -r '.[]')
          test -n "$names" || { echo "no darwinConfigurations" >&2; exit 1; }
          for name in $names; do
            echo "::group::$name"
            nix build --no-update-lock-file --no-link ".#darwinConfigurations.\"$name\".system"
            echo "::endgroup::"
          done

  # The devcontainer profile, switched for a real vscode user whose ~/.zshrc
  # already exists, as the image's oh-my-zsh one does: home-manager takes it
  # over (-b moves the old one aside), and an interactive zsh must then have
  # tools/zsh/interactive.zsh on top of home-manager's defaults. The copy in
  # /tmp is one vscode can read; path: keeps nix from asking git about it.
  home:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: A vscode user with a ~/.zshrc of its own
        run: |
          sudo apt-get install -y --no-install-recommends zsh
          sudo useradd --create-home --shell /usr/bin/zsh vscode
          echo '# oh-my-zsh, as the image has' | sudo -u vscode tee /home/vscode/.zshrc > /dev/null
          cp -R . /tmp/dotfiles && chmod -R a+rX /tmp/dotfiles
      - name: Switch
        working-directory: /tmp/dotfiles
        shell: bash
        run: >-
          sudo -u vscode -H env PATH="$PATH" USER=vscode
          nix run --no-update-lock-file path:.#home-manager --
          switch -b backup --flake path:.#vscode@x86_64-linux
          2>&1 | tee "$RUNNER_TEMP/switch.log"
      - name: The old ~/.zshrc was moved aside
        run: sudo grep -q oh-my-zsh /home/vscode/.zshrc.backup
      # The user has no ~/.age/personal-key.txt, as a devcontainer on a host
      # without one: home-manager/agenix.nix must say it can't decrypt
      # example.age, install nothing and leave no .tmp behind, and the switch
      # above still succeed.
      - name: Without a key, agenix warns and installs nothing
        run: |
          grep -F "agenix: could not decrypt 'example'" "$RUNNER_TEMP/switch.log"
          sudo test ! -e /home/vscode/.local/share/agenix/example
          test -z "$(sudo find /home/vscode/.local/share -name '*.tmp')"
      # The runner has completion dirs compaudit rejects (as a Mac with
      # another account's Homebrew does). The profile's compinit -i skips
      # them, so zsh must start without compinit saying anything.
      - name: Interactive zsh
        run: |
          sudo -u vscode -H zsh -i /tmp/dotfiles/.github/scripts/check-hm-zsh 2> "$RUNNER_TEMP/stderr"
          cat "$RUNNER_TEMP/stderr"
          if grep -q compinit "$RUNNER_TEMP/stderr"; then
            echo "compinit complained at startup" >&2
            exit 1
          fi
      # With a key: a throwaway one, and a secret encrypted to it in the copy,
      # which path: reads untracked. Switching again must install that secret
      # as ~/.local/share/agenix/ci, vscode's, mode 0400; example.age, which
      # the key doesn't open, still only warns.
      - name: With a key, agenix installs what it decrypts
        shell: bash
        run: |
          with_rage() { nix shell --inputs-from . nixpkgs#rage -c "$@"; }
          with_rage rage-keygen -o "$RUNNER_TEMP/key.txt"
          recipient=$(sed -n 's/^# public key: //p' "$RUNNER_TEMP/key.txt")
          test -n "$recipient"
          echo 'from ci' | with_rage rage -a -r "$recipient" -o /tmp/dotfiles/secrets/ci.age
          sudo install -d -o vscode -m 700 /home/vscode/.age
          sudo install -o vscode -m 600 "$RUNNER_TEMP/key.txt" /home/vscode/.age/personal-key.txt
          cd /tmp/dotfiles
          sudo -u vscode -H env PATH="$PATH" USER=vscode \
            nix run --no-update-lock-file path:.#home-manager -- \
            switch -b backup --flake path:.#vscode@x86_64-linux \
            2>&1 | tee "$RUNNER_TEMP/switch-key.log"
          grep -F "agenix: could not decrypt 'example'" "$RUNNER_TEMP/switch-key.log"
          test "$(sudo stat -c '%a %U' /home/vscode/.local/share/agenix/ci)" = '400 vscode'
          test "$(sudo cat /home/vscode/.local/share/agenix/ci)" = 'from ci'
