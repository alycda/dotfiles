# Every commit on a pull request follows the commit-craft format
# (tools/commit/check-commit-msg). PRs here are squash-merged and the squash
# body is the branch commits' messages, so they are checked, not only the
# title. Pull requests only: a direct push can carry older commits.
name: commit messages

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check commit messages
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit; the comment is the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: tools/commit/check-commits "$BASE..$HEAD"
