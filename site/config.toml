# Zola configuration.
#
# Content is NOT authored here — `site/content/` is generated from `docs/`
# by `site/bin/collect.py` (see `just docs-build`). Edit the markdown in
# `docs/`, not anything under `site/content/`.

base_url = "https://alycda.github.io/dotfiles"
title = "dotfiles"
description = "Notes from a long argument with Nix."

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
  { name = "tags", feed = true },
  { name = "category", feed = false },
]

[markdown]
highlight_code = true
highlight_theme = "css"
highlight_themes_css = [
  { theme = "gruvbox-light", filename = "syntax-light.css" },
  { theme = "gruvbox-dark", filename = "syntax-dark.css" },
]
smart_punctuation = true

[extra]
author = "Alyssa"
repo_url = "https://github.com/alycda/dotfiles"
