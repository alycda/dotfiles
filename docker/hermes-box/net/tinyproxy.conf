## The allowlist door (only runs with `--profile allowlist`).
##
## Nothing here is the security boundary: the boundary is that the `hermes-box`
## network is `internal: true`, so the agent container has no default route at
## all. This proxy is a container with a second interface - the ONLY one that
## can carry a request off the host - and it refuses every hostname that is not
## in /etc/tinyproxy/allowlist.
##
## Read it as: the wall is the network, this is the guest list at the one door.

Port 8888
Listen 0.0.0.0
Timeout 600

## Who may ASK (not what they may reach). Only the internal box network can
## route here at all; RFC1918 keeps that true if the compose network ever
## changes subnets. Public source addresses are refused.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

## Deny-by-default hostname filter. FilterDefaultDeny inverts the file's
## meaning: with it On, /etc/tinyproxy/allowlist is an ALLOW list, and an empty
## file blocks everything. That is the intended starting state.
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
## Off = match against the HOST, not the full URL. Host matching is what an
## allowlist wants; URL matching only sees the path on plain HTTP and nothing
## at all inside a CONNECT tunnel.
FilterURLs Off

## CONNECT (i.e. HTTPS) is tunnelled, so TLS stays end-to-end: tinyproxy sees
## the hostname, resolves it itself, and copies bytes. It does not terminate,
## inspect, or MITM anything. Restrict the ports it will tunnel to 443 - without
## this, CONNECT is an any-port outbound.
ConnectPort 443

## No User/Group here: the container drops ALL capabilities, so tinyproxy
## cannot setuid/setgid at runtime even as root. compose.yaml starts it AS the
## tinyproxy user instead (`user: tinyproxy`), which is the same end state
## without handing the process CAP_SETUID/CAP_SETGID to get there. Setting
## these directives anyway produces: "Unable to change to group tinyproxy".

## No LogFile: with `-d` tinyproxy logs to stdout, so `docker logs` is the
## audit trail - every allowed and denied request, with the hostname.
LogLevel Info
DisableViaHeader Yes
