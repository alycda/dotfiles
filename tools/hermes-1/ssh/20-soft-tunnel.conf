# soft-tunnel: felixia's key for pushing ~/ledger to Soft Serve. It may open
# one local forward to Soft Serve's loopback port and nothing else. The key's
# authorized_keys line restricts the same things; this is the second layer,
# and the only one that stops -R (port-forwarding re-enables it per key).
Match User soft-tunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:23231
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
