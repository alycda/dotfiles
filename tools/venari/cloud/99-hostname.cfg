# venari: keep the hostname this box was given here, not the one the provider
# metadata reports. cloud-init runs set_hostname + update_hostname on EVERY
# boot, and 90-hetznercloud.cfg sets preserve_hostname: false, so without this
# the name reverts to the provider console label at the next unattended-upgrades
# reboot. Drop-ins merge in lexical order, so 99- wins over 90-.
#
# Rename the box in the provider console too, so the two agree; this file is
# what makes the box authoritative if they ever drift.
preserve_hostname: true
