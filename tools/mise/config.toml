# Global mise config for the macOS account that has no Nix and no admin rights.
# Every other account gets its tools from home-manager; this one can't run a
# switch, so mise installs prebuilt binaries into ~/.local/share/mise instead.
#
# Set up with tools/mise/bootstrap.sh, which is safe to run again:
#
#   curl -fsSL https://raw.githubusercontent.com/alycda/dotfiles/main/tools/mise/bootstrap.sh | sh
#
# It clones ~/dotfiles over https, installs mise with https://mise.run/zsh
# (which also adds the activate line to ~/.zshrc), links ~/.config/mise and
# ~/.config/helix into the checkout, includes tools/git/config from
# ~/.gitconfig, and runs `mise install`. Then run the tasks that ask questions:
#
#   mise run gh-login         # SSH key, gh login, checkout remote to SSH
#   mise run macos-defaults
#   mise run dock
#
# Link the directory, not just this file: `mise use -g <tool>` edits the file in
# place through the link, so new tools show up here as a diff to commit.
#
# Keep this list short. A tool belongs here only if this account really uses
# it. Anything the containers also need goes in lib/core-packages.nix.

[tools]
claude = "latest" # aqua:anthropics/claude-code
helix = "latest"  # aqua:helix-editor/helix
jj = "latest"     # aqua:jj-vcs/jj (prebuilt; the cargo:jj-cli fallback compiles)
gh = "latest"     # log in once: mise run gh-login
restic = "latest" # aqua:restic/restic (offsite backup client; felixia/ pins it, see there)

# Proton Pass CLI. Proton publishes bare binaries on proton.me, not GitHub, so
# no registry backend covers it and `latest` is not available: bump version and
# both checksums together from https://proton.me/download/pass-cli/versions.json
# Never run `pass-cli update` on a mise install: it replaces the binary under
# mise and the checksum stops describing what runs. Log in once: pass-cli login
[tools."http:pass-cli"]
version = "2.3.3"
bin = "pass-cli"

[tools."http:pass-cli".platforms.macos-arm64]
url = "https://proton.me/download/pass-cli/{{version}}/pass-cli-macos-aarch64"
checksum = "sha256:3281587ac9c50ae2f1604ba75e9d1d39b6debb221b65a6cc56f64d626ede3dbc"

[tools."http:pass-cli".platforms.macos-x64]
url = "https://proton.me/download/pass-cli/{{version}}/pass-cli-macos-x86_64"
checksum = "sha256:275f6159f63d152ecdd9d4e2969ef515291619005e0d30ab762daee26081621c"

# Tasks are one-time setup steps you run by hand (`mise run <task>`), written
# so that running one again does nothing. Never make them run automatically,
# e.g. from a hook: a login prompt with no terminal attached just hangs.
[tasks.ssh-key]
description = "Create an SSH key for GitHub, unless one exists"
# gh-login uses SSH, so this runs first. The key gets the default name
# (id_ed25519). The Host block below makes ssh store the passphrase in the
# macOS keychain on first use and reload the key after a reboot. Without it,
# GitHub only works while some other key (e.g. tangled.org's) is in the agent.
# UseKeychain is macOS-only; IgnoreUnknown keeps the block valid for Linux ssh,
# which otherwise rejects the whole config file.
run = '''
if [ -f ~/.ssh/id_ed25519 ]; then
  echo "ssh: ~/.ssh/id_ed25519 already exists"
else
  mkdir -p ~/.ssh && chmod 700 ~/.ssh
  ssh-keygen -t ed25519 -C "$(whoami)@$(hostname -s)" -f ~/.ssh/id_ed25519
fi
if ! grep -qx 'Host github.com' ~/.ssh/config 2>/dev/null; then
  printf '\nHost github.com\n    AddKeysToAgent yes\n    IgnoreUnknown UseKeychain\n    UseKeychain yes\n    IdentityFile ~/.ssh/id_ed25519\n' >> ~/.ssh/config
  echo "ssh: added a github.com block to ~/.ssh/config"
fi
'''

[tasks.gh-login]
description = "Log gh in over SSH, unless it already is"
depends = ["ssh-key"]
# Logging in with --git-protocol ssh offers to upload ~/.ssh/id_ed25519.pub.
# If gh was already logged in, upload the key directly unless GitHub has it.
# Last, bootstrap.sh cloned ~/dotfiles over https, and this account has no git
# credential helper, so pushing needs SSH. Switch the remote once GitHub
# accepts the key (ssh -T exits 1 even on success, hence the grep).
run = '''
if ! gh auth status >/dev/null 2>&1; then
  gh auth login --git-protocol ssh
elif gh ssh-key list 2>/dev/null | grep -qF "$(cut -d' ' -f2 ~/.ssh/id_ed25519.pub)"; then
  echo "gh: logged in, and GitHub has ~/.ssh/id_ed25519.pub"
else
  gh ssh-key add ~/.ssh/id_ed25519.pub --title "$(whoami)@$(hostname -s)"
fi
remote=$(git -C ~/dotfiles remote get-url origin 2>/dev/null || true)
case "$remote" in
  https://github.com/*)
    if ssh -T -o StrictHostKeyChecking=accept-new git@github.com 2>&1 | grep -q "successfully authenticated"; then
      git -C ~/dotfiles remote set-url origin "git@github.com:${remote#https://github.com/}"
      echo "gh: ~/dotfiles now pushes over SSH ($(git -C ~/dotfiles remote get-url origin))"
    else
      echo "gh: GitHub doesn't accept the SSH key yet; ~/dotfiles stays on $remote"
    fi
    ;;
esac
'''

# One backup of $HOME with the same script and excludes home-manager uses
# (tools/restic/backup.sh). Extra args go to restic: `mise run backup snapshots`.
# Needs ~/.config/restic/env with RESTIC_REPOSITORY and RESTIC_PASSWORD - this
# account has no age, so copy it from a machine that can decrypt
# secrets/personal/restic-env.age. Scheduling is by hand here; the launchd
# agent belongs to the home-manager module.
[tasks.backup]
description = "Back up $HOME with restic, or run a restic command against the repo"
run = "~/dotfiles/tools/restic/backup.sh"

[tasks.macos-defaults]
description = "Apply macOS user settings (no admin needed)"
# Scrolling: turn off "natural" (reversed) scrolling. Takes full effect after
# logging out and back in.
run = "defaults write -g com.apple.swipescrolldirection -bool false"

[tasks.dock]
description = "Reset the Dock's apps to this list"
# Replaces the Dock's app list, so drag-and-drop changes are lost: edit the list
# here instead. The Downloads stack (persistent-others) is left alone. Every
# app must exist, or its tile shows as "?"; the /Applications ones are casks in
# darwin/modules/homebrew-personal.nix (this machine is shesfast), installed
# by the admin account.
run = '''
defaults write com.apple.dock persistent-apps -array
for app in \
  /Applications/Claude.app \
  /Applications/WorkFlowy.app \
  "/Applications/Brave Browser.app" \
  /Applications/cmux.app \
  "/Applications/Visual Studio Code.app" \
  /System/Applications/Launchpad.app \
  /System/Applications/Mail.app \
  /System/Applications/Reminders.app \
  /System/Applications/Notes.app \
  /System/Applications/Freeform.app \
  /Applications/Arc.app \
  ~/Applications/VisualJJ.app
do
  [ -d "$app" ] || echo "dock: missing $app"
  defaults write com.apple.dock persistent-apps -array-add \
    "<dict><key>tile-data</key><dict><key>file-data</key><dict><key>_CFURLString</key><string>$app</string><key>_CFURLStringType</key><integer>0</integer></dict></dict></dict>"
done
killall Dock
'''
